# Maintained deployment asset at .github/workflows/deploy-pages.yml.
# Future consumer: GitHub Pages publishing the canonical Generations Kitchen site.
# Activation: auto-load on every main-branch push, or execute workflow_dispatch.
# Behavioral check: the build job runs the complete Linux export/media suite and
# deploys only its verified dist/client artifact. Retire if the owner moves the
# canonical site away from GitHub Pages.
name: Deploy Generations Kitchen to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Build and verify static site
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
